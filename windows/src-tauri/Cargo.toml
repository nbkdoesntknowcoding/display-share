[package]
name = "display-share-receiver"
version = "0.1.0"
description = "Display Share — Windows receiver"
edition = "2021"
rust-version = "1.77"

[lib]
name = "display_share_receiver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# ws:// only on a LAN, so no TLS feature - it keeps the build light and the
# dependency surface small.
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Bonjour/mDNS browsing so the receiver never needs an IP typed in.
mdns-sd = "0.11"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Updater: checks GitHub Releases for a newer build. Payloads are verified
# against the keypair above — Tauri requires this even though the installer
# itself is unsigned, and the updater keypair is free.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
