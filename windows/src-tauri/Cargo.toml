[package]
name = "display-share-receiver"
version = "0.1.0"
description = "Display Share — Windows receiver"
edition = "2021"
rust-version = "1.77"

[lib]
name = "display_share_receiver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# ws:// only on a LAN, so no TLS feature - it keeps the build light and the
# dependency surface small.
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Bonjour/mDNS browsing so the receiver never needs an IP typed in.
mdns-sd = "0.11"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Updater: checks GitHub Releases for a newer build. Payloads are verified
# against the keypair above — Tauri requires this even though the installer
# itself is unsigned, and the updater keypair is free.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Task 8.1: DXGI Desktop Duplication for capturing the real Windows desktop.
[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # Needed only to read DXGI_OUTPUT_DESC, which carries an HMONITOR.
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_Media_MediaFoundation",
  # Task 8.3: SendInput, and the virtual-desktop metrics its absolute
  # coordinates are measured against.
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Task 10.2: naming the adapter a session is actually running over, so the
  # app can tell the user whether a cable would help.
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }
