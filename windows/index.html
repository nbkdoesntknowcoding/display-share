<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Share — Receiver</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  /* The app is one fullscreen canvas; everything else floats above it. */
  #screen { width:100vw; height:100vh; object-fit:contain; display:block; background:#000; }
  #hud {
    position:fixed; top:12px; left:12px; padding:10px 14px;
    font:12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color:#e8e8e8; background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.16);
    border-radius:8px; backdrop-filter:blur(8px); pointer-events:none; white-space:pre;
  }
  #hud.hidden { display:none; }
  #overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; text-align:center; white-space:pre-line;
    color:#d8d8d8; background:rgba(0,0,0,.86); font-size:14px; padding:24px;
  }
  #bar { display:flex; gap:8px; }
  input, button {
    font:14px ui-sans-serif, system-ui; padding:8px 12px; border-radius:8px;
    border:1px solid rgba(255,255,255,.2); background:#151515; color:#eee;
  }
  button { background:#2563eb; border-color:#2563eb; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  #senders { display:flex; flex-direction:column; gap:6px; min-width:340px; }
  .sender { background:#1f2937; border-color:rgba(255,255,255,.18); text-align:left; }
  .sender:hover { background:#374151; }
  #pin-row { display:none; gap:8px; }
  #pin { width:90px; text-align:center; font:20px ui-monospace, monospace; letter-spacing:4px; }
  #pin-message { display:none; font-size:13px; max-width:380px; }
  /* Input forwarding is a strong capability; its state must be unmissable. */
  #input-badge {
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    padding:6px 14px; border-radius:999px; font:12px/1 ui-monospace, monospace;
    letter-spacing:.5px; color:#08130a; background:#34d399; display:none;
    box-shadow:0 2px 12px rgba(0,0,0,.4); pointer-events:none;
  }
  #input-badge.active { display:block; }
  #update-bar {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:#1f2937; border:1px solid rgba(255,255,255,.18); border-radius:10px;
    font:13px ui-sans-serif, system-ui; color:#e8e8e8; z-index:10;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  #update-bar button { font-size:12px; padding:6px 10px; }
  #update-bar button.ghost { background:transparent; border-color:rgba(255,255,255,.2); }
</style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="hud">starting…</div>
  <div id="input-badge"></div>
  <div id="overlay">
    <div id="message"><strong>Display Share — Receiver</strong><br>This is the app for the screen you want to USE as a second display.<br>The Mac runs the sender, which lives in its menu bar.<br><br>Looking for senders…</div>
    <div id="senders"></div>
    <div id="pin-message"></div>
    <div id="pin-row">
      <input id="pin" placeholder="PIN" maxlength="4" inputmode="numeric" autocomplete="off">
      <button id="pin-submit">Pair</button>
    </div>
    <div id="bar">
      <input id="address" placeholder="192.168.1.42 (manual)" autocomplete="off" spellcheck="false">
      <button id="connect">Connect</button>
      <button id="rescan">Rescan</button>
    </div>
    <!-- The reverse direction (Task 8.2). Deliberately below the receiving
         controls and visually quieter: receiving is what most people install
         this for, and a prominent second action here is how the two-apps
         confusion started. Full role selection is Task 8.4. -->
    <div id="share-row">
      <button id="share">Share this PC's screen instead</button>
      <span id="share-status"></span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
