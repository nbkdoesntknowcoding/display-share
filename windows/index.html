<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Share</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  /* The app is one fullscreen canvas; everything else floats above it. */
  #screen { width:100vw; height:100vh; object-fit:contain; display:block; background:#000; }
  #hud {
    position:fixed; top:12px; left:12px; padding:10px 14px;
    font:12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color:#e8e8e8; background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.16);
    border-radius:8px; backdrop-filter:blur(8px); pointer-events:none; white-space:pre;
  }
  #hud.hidden { display:none; }
  #overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; text-align:center; white-space:pre-line;
    color:#d8d8d8; background:rgba(0,0,0,.86); font-size:14px; padding:24px;
  }
  #bar { display:flex; gap:8px; }
  input, button {
    font:14px ui-sans-serif, system-ui; padding:8px 12px; border-radius:8px;
    border:1px solid rgba(255,255,255,.2); background:#151515; color:#eee;
  }
  button { background:#2563eb; border-color:#2563eb; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  #senders { display:flex; flex-direction:column; gap:6px; min-width:340px; }
  .sender { background:#1f2937; border-color:rgba(255,255,255,.18); text-align:left; }
  .sender:hover { background:#374151; }
  #pin-row { display:none; gap:8px; }
  #pin { width:90px; text-align:center; font:20px ui-monospace, monospace; letter-spacing:4px; }
  #pin-message { display:none; font-size:13px; max-width:380px; }
</style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="hud">starting…</div>
  <div id="overlay">
    <div id="message">Looking for senders…</div>
    <div id="senders"></div>
    <div id="pin-message"></div>
    <div id="pin-row">
      <input id="pin" placeholder="PIN" maxlength="4" inputmode="numeric" autocomplete="off">
      <button id="pin-submit">Pair</button>
    </div>
    <div id="bar">
      <input id="address" placeholder="192.168.1.42 (manual)" autocomplete="off" spellcheck="false">
      <button id="connect">Connect</button>
      <button id="rescan">Rescan</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
