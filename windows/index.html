<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Share — Receiver</title>
<style>
  /* Task 9.2. Two rules here are not taste, they are defects already hit:
     - Receiving and sharing must stay visually distinct. A prominent second
       action is how the "which app am I in?" confusion started.
     - Status has its own element (#message). Writing status into the container
       destroyed the sender list, the PIN row and the address field in one line,
       because setting textContent replaces every child. */
  :root {
    color-scheme: dark;
    --bg: #08090b;
    --card: #14161a;
    --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.18);
    --text: #f2f3f5;
    --muted: #9aa1ab;
    --accent: #3b82f6;
    --accent-hover: #2f6fdc;
    --ok: #34d399;
  }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); overflow:hidden;
               font-family: ui-sans-serif, system-ui, "Segoe UI Variable Text", "Segoe UI", sans-serif;
               color:var(--text); -webkit-font-smoothing:antialiased; }
  /* The app is one fullscreen canvas; everything else floats above it. */
  #screen { width:100vw; height:100vh; object-fit:contain; display:block; background:#000; }

  #hud {
    position:fixed; top:14px; left:14px; padding:9px 12px;
    font:11.5px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color:#e8e8e8; background:rgba(8,9,11,.66); border:1px solid var(--line-strong);
    border-radius:10px; backdrop-filter:blur(10px); pointer-events:none; white-space:pre;
  }
  #hud.hidden { display:none; }

  /* Input forwarding is a strong capability; its state must be unmissable. */
  #input-badge {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    padding:7px 15px; border-radius:999px; font:11.5px/1 ui-monospace, monospace;
    letter-spacing:.4px; font-weight:600; color:#062012; background:var(--ok); display:none;
    box-shadow:0 4px 16px rgba(0,0,0,.45); pointer-events:none;
  }
  #input-badge.active { display:block; }

  #overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; background:
      radial-gradient(1100px 520px at 50% -8%, rgba(59,130,246,.16), transparent 62%),
      rgba(8,9,11,.94);
    overflow-y:auto;
  }
  #card {
    width:100%; max-width:430px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:26px 24px 22px;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  #brand { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  #brand-dot {
    width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none;
    box-shadow:0 0 0 4px rgba(59,130,246,.16);
  }
  h1 { margin:0; font-size:16px; font-weight:650; letter-spacing:-.01em; }
  #role { margin:0 0 18px; font-size:12.5px; color:var(--muted); line-height:1.5; }

  /* Dedicated status element — never the container. */
  #message { font-size:13px; color:var(--muted); line-height:1.55; margin-bottom:14px;
             white-space:pre-line; }

  #senders { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
  #senders:empty { display:none; }
  .sender {
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:#1c1f25; border:1px solid var(--line-strong); color:var(--text);
    font-size:13.5px; padding:11px 13px; border-radius:10px; cursor:pointer;
  }
  .sender:hover { background:#242830; border-color:rgba(255,255,255,.28); }

  .field-row { display:flex; gap:8px; }
  input, button, select {
    font:13.5px ui-sans-serif, system-ui; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line-strong); background:#1c1f25; color:var(--text);
    outline:none;
  }
  input { flex:1; min-width:0; }
  input::placeholder { color:#6b7280; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.18); }
  button { background:var(--accent); border-color:var(--accent); cursor:pointer;
           font-weight:550; flex:none; }
  button:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button:disabled { opacity:.55; cursor:default; }
  button.ghost { background:transparent; border-color:var(--line-strong); color:var(--muted); }
  button.ghost:hover { background:#1c1f25; color:var(--text); }

  #pin-row { display:none; gap:8px; margin-bottom:12px; }
  #pin { flex:none; width:104px; text-align:center; font:19px ui-monospace, monospace;
         letter-spacing:5px; }
  #pin-message { display:none; font-size:12.5px; color:var(--muted); line-height:1.5;
                 margin-bottom:9px; }

  /* The reverse direction, deliberately quieter than receiving: receiving is
     what almost everyone installs this for. */
  #share-row {
    margin-top:20px; padding-top:17px; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:9px;
  }
  #share-row select { width:100%; }
  #share-row button { background:transparent; border-color:var(--line-strong);
                      color:var(--muted); font-weight:500; }
  #share-row button:hover { background:#1c1f25; color:var(--text); }
  #share-status { font-size:12px; color:var(--muted); line-height:1.5; }

  #update-bar {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; padding:11px 15px;
    background:var(--card); border:1px solid var(--line-strong); border-radius:12px;
    font:12.5px ui-sans-serif, system-ui; color:var(--text); z-index:10;
    box-shadow:0 8px 26px rgba(0,0,0,.55);
  }
  #update-bar button { font-size:12px; padding:7px 11px; }
  #update-bar button.ghost { background:transparent; border-color:var(--line-strong); }
</style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="hud">starting…</div>
  <div id="input-badge"></div>
  <div id="overlay">
    <div id="card">
      <!-- Header is static. It is NOT the status element, so status updates can
           never blank out the app's identity. -->
      <div id="brand">
        <span id="brand-dot"></span>
        <h1>Display Share</h1>
      </div>
      <p id="role">
        This PC becomes a second display for your Mac. The Mac runs the sender,
        which lives in its menu bar.
      </p>

      <div id="message">Looking for senders…</div>
      <div id="senders"></div>

      <div id="pin-message"></div>
      <div id="pin-row">
        <input id="pin" placeholder="0000" maxlength="4" inputmode="numeric" autocomplete="off">
        <button id="pin-submit">Pair</button>
      </div>

      <div id="bar" class="field-row">
        <input id="address" placeholder="Mac address, e.g. 192.168.1.42" autocomplete="off" spellcheck="false">
        <button id="connect">Connect</button>
        <button id="rescan" class="ghost">Rescan</button>
      </div>

      <!-- The reverse direction (Tasks 8.2 / 8.4). Below the receiving controls
           and visually quieter on purpose: a prominent second action here is how
           the two-apps confusion started. -->
      <div id="share-row">
        <select id="share-output" hidden></select>
        <button id="share">Share this PC's screen instead</button>
        <button id="stop-share" class="ghost" hidden>Stop sharing</button>
        <span id="share-status"></span>
      </div>
    </div>
    <!-- The reverse direction (Task 8.2). Deliberately below the receiving
         controls and visually quieter: receiving is what most people install
         this for, and a prominent second action here is how the two-apps
         confusion started. Full role selection is Task 8.4. -->
    <div id="share-row">
      <button id="share">Share this PC's screen instead</button>
      <span id="share-status"></span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
