name: Release

# Task 7.1 — tag push produces attached release artifacts with no manual steps.
#
# Two entry points, deliberately:
#   * release-please watches main, keeps a release PR updated from Conventional
#     Commits, and tags when that PR merges.
#   * the build jobs fire on the tag, so a hand-pushed tag works identically.
#     A release process that only works through one path is one bad day from
#     being unusable.
#
# Artifacts are UNSIGNED — see docs/distribution.md. The release notes say so
# rather than letting people discover it at the Gatekeeper prompt.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v0.2.0)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------- changelog + tag
  release-please:
    name: Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Single source of truth. Declaring extra-files here as well would
          # conflict with the config, and the config's structured form is the one
          # that can target a specific YAML/JSON path — so a release cannot claim
          # a version the built app does not actually report.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ------------------------------------------------------------- macOS dmg
  macos:
    name: macOS (universal .dmg)
    needs: [release-please]
    # A tag pushed by GITHUB_TOKEN does NOT trigger a workflow run — GitHub
    # blocks that to prevent recursion — so gating only on `refs/tags/v*` means
    # a release-please release silently builds nothing. Also accept the
    # release_created output, and a manual dispatch for re-attaching assets.
    # always() is required because release-please is skipped on a tag push, and
    # a skipped dependency would otherwise skip this job too.
    if: |
      always() && (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.release-please.outputs.release_created == 'true' ||
        inputs.tag != ''
      )
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAGGED source, not whatever main happens to be. Note the
          # consequence: a defect already baked into a tag cannot be repaired by
          # fixing main — it needs a new version (see docs/distribution.md).
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}

      - run: brew install xcodegen create-dmg

      - name: Tests must pass before an artifact is published
        working-directory: mac
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project DisplayShare.xcodeproj -scheme DisplayShareCore \
            -configuration Debug -derivedDataPath ./.build test

      - name: Package
        working-directory: mac
        env:
          # Present only if someone ever donates a certificate; absent is fine.
          DS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          DS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DS_APPLE_ID: ${{ secrets.APPLE_ID }}
          DS_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/package-macos.sh

      - name: Checksums
        working-directory: mac/dist
        # Users verifying an unsigned download have nothing else to go on, so
        # the checksum is not decoration here.
        run: shasum -a 256 ./*.dmg > SHA256SUMS-macos.txt

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref_name }}
        # --clobber so a re-run replaces assets instead of failing on conflict.
        run: gh release upload "$TAG" mac/dist/*.dmg mac/dist/SHA256SUMS-macos.txt --clobber

  # -------------------------------------------------------- Windows exe/msi
  windows:
    name: Windows (NSIS .exe)
    needs: [release-please]
    # A tag pushed by GITHUB_TOKEN does NOT trigger a workflow run — GitHub
    # blocks that to prevent recursion — so gating only on `refs/tags/v*` means
    # a release-please release silently builds nothing. Also accept the
    # release_created output, and a manual dispatch for re-attaching assets.
    # always() is required because release-please is skipped on a tag push, and
    # a skipped dependency would otherwise skip this job too.
    if: |
      always() && (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.release-please.outputs.release_created == 'true' ||
        inputs.tag != ''
      )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAGGED source, not whatever main happens to be. Note the
          # consequence: a defect already baked into a tag cannot be repaired by
          # fixing main — it needs a new version (see docs/distribution.md).
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install and verify
        working-directory: windows
        run: |
          npm ci
          npm run build
          node scripts/verify-vectors.mjs

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Updater signing key — free, unrelated to code signing certificates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: windows
          # FALSE on purpose. With this true, tauri-action consumes the .sig
          # files to build its own updater JSON and then discards them, because
          # it has no release of its own to upload to — leaving nothing to
          # publish. Off, the .sig files survive and the next step builds
          # latest.json from them.
          includeUpdaterJson: false
          # Updater artifacts are enabled HERE rather than in tauri.conf.json:
          # committed, the flag makes `tauri build` fail for anyone without the
          # private signing key, which is every contributor building from source.
          args: --config {"bundle":{"createUpdaterArtifacts":true}}

      - name: Checksums
        shell: bash
        working-directory: windows/src-tauri/target/release/bundle
        run: |
          find . \( -name '*.exe' -o -name '*.msi' \) -print0 \
            | xargs -0 sha256sum > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - name: Attach artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref_name }}
        working-directory: windows/src-tauri/target/release/bundle
        run: |
          gh release upload "$TAG" nsis/*.exe msi/*.msi SHA256SUMS-windows.txt --clobber

          # latest.json is what the updater endpoint fetches. tauri-action only
          # emits it when IT manages the release upload, which would clash with
          # the release-please release — so build it here from the .sig tauri
          # writes next to the installer.
          EXE=$(find nsis -name '*-setup.exe' | head -1)
          SIG="${EXE}.sig"
          if [ -f "$SIG" ]; then
            # The version MUST come from the artifact, never from the tag.
            # Deriving it from the tag published latest.json saying 0.10.0 while
            # the installer inside was 0.9.4, so every app updated, came back
            # reporting the older version, and updated again on the next launch —
            # an infinite loop that only stops when someone notices.
            EXE_NAME=$(basename "$EXE")
            VER=$(echo "$EXE_NAME" | sed -E 's/.*_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/')
            if [ -z "$VER" ] || [ "$VER" = "$EXE_NAME" ]; then
              echo "::error::could not read a version out of $EXE_NAME"
              exit 1
            fi
            # A tag that disagrees with what was built means someone's installed
            # app will loop. Fail the release rather than publish it.
            if [ "$VER" != "${TAG#v}" ]; then
              echo "::error::tag $TAG does not match the built version $VER — refusing to publish an updater manifest that would loop"
              exit 1
            fi
            # Ask GitHub what it CALLED the asset rather than deriving the name
            # locally. Upload rewrites spaces to dots, so a URL built from
            # "Display Share Receiver_x64-setup.exe" — percent-encoded or not —
            # points at a file that does not exist, and every Windows update
            # failed with 404 while latest.json itself served perfectly.
            URL=$(gh release view "$TAG" --json assets \
              -q '.assets[] | select(.name | endswith("-setup.exe")) | .url' | head -1)
            if [ -z "$URL" ]; then
              echo "::error::no -setup.exe asset found on $TAG; updater manifest not published"
              exit 1
            fi
            python3 - "$VER" "$URL" "$SIG" "$TAG" > latest.json <<'PYEOF'
          import json, sys, datetime
          ver, url, sig_path, tag = sys.argv[1:5]
          print(json.dumps({
              "version": ver,
              "notes": "See the release page for details.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": open(sig_path).read().strip(),
                      "url": url,
                  }
              },
          }, indent=2))
          PYEOF
            cat latest.json
            gh release upload "$TAG" latest.json --clobber

            # Follow the URL the manifest actually publishes. A reachable,
            # correctly signed manifest pointing at a missing file looks healthy
            # from every check that stops at latest.json — which is exactly how
            # the 404 above shipped. Fail the release instead.
            PUBLISHED=$(python3 -c "import json;print(json.load(open('latest.json'))['platforms']['windows-x86_64']['url'])")
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$PUBLISHED")
            if [ "$CODE" != "200" ]; then
              echo "::error::latest.json points at $PUBLISHED which returns HTTP $CODE"
              exit 1
            fi
            echo "updater payload reachable: $PUBLISHED"
          else
            echo "::warning::no .sig produced — updater manifest not published"
            find nsis -type f | head -20
          fi

  # ------------------------------------------------------------- publish
  notes:
    name: Release notes
    needs: [release-please, macos, windows]
    if: |
      always() && needs.macos.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepend the unsigned-build notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref_name }}
        # Put the warning where people are standing when they hit it, rather
        # than only in the docs.
        run: |
          NOTICE=$(cat <<'EOF'
          > **These builds are unsigned.** Display Share is open source and does not
          > buy code signing certificates, so both operating systems will warn on
          > first launch.
          >
          > * **macOS** — open it once, then System Settings → Privacy & Security →
          >   **Open Anyway**.
          > * **Windows** — **More info** → **Run anyway**.
          >
          > Building from source avoids the warning entirely. See
          > [docs/distribution.md](docs/distribution.md), and verify downloads
          > against the attached `SHA256SUMS` files.

          EOF
          )
          EXISTING=$(gh release view "$TAG" --json body -q .body 2>/dev/null || echo "")
          printf '%s\n%s' "$NOTICE" "$EXISTING" > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
