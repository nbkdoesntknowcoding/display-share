name: Build

# Builds artifacts for both platforms.
#
# Display Share is OPEN SOURCE and ships UNSIGNED by decision — no Apple
# Developer ID, no Windows OV certificate. The signing steps below are kept
# because they cost nothing when the secrets are absent, and would start working
# the day someone donates a certificate. Nothing here gates on a signature.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and notarize (requires secrets)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------- lint
  # A workflow with an invalid expression fails at STARTUP with zero jobs and
  # no readable error, which is how the `secrets`-in-`if` bug here went
  # unnoticed. actionlint catches that class of mistake before it merges.
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the binary directly rather than via a third-party action: the
      # reviewdog wrapper needs checks:write, which this workflow deliberately
      # does not grant.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # ------------------------------------------------------------------ macOS
  # MUST run on macOS: notarytool and stapler are macOS-only, so the Linux VPS
  # cannot do this step no matter how the rest is deployed.
  macos:
    name: macOS (universal .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: brew install xcodegen create-dmg

      - name: Run unit tests
        working-directory: mac
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project DisplayShare.xcodeproj -scheme DisplayShareCore \
            -configuration Debug -derivedDataPath ./.build test

      - name: Verify protocol vectors against the TypeScript parser
        working-directory: windows
        run: |
          npm ci
          node scripts/verify-vectors.mjs

      # Signing only when the secrets exist. A fork PR has none, and must still
      # get a green build rather than a confusing failure.
      - name: Import Developer ID certificate
        # No `if:` here on purpose: the `secrets` context is NOT available in
        # `if` expressions, and using it there makes the whole workflow fail to
        # start with no jobs and no useful error. Guard inside the script.
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "No signing certificate configured — skipping (expected: this project ships unsigned)."
            exit 0
          fi
          # Ephemeral keychain: never touches the runner's default keychain, and
          # dies with the runner.
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt that never appears.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/certificate.p12

      - name: Package
        working-directory: mac
        env:
          DS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          DS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DS_APPLE_ID: ${{ secrets.APPLE_ID }}
          DS_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/package-macos.sh

      # Report the Gatekeeper verdict but do NOT gate on it. Display Share is
      # open source and ships unsigned by decision, so "rejected" is the
      # expected state, not a build failure.
      - name: Report Gatekeeper status
        working-directory: mac
        run: |
          DMG="$(find dist -maxdepth 1 -name '*.dmg' | head -1)"
          echo "### macOS artifact" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          spctl -a -vvv -t install "$DMG" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if ! spctl -a -t install "$DMG" >/dev/null 2>&1; then
            echo "Unsigned build — users must use Privacy & Security -> Open Anyway." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: mac/dist/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (NSIS .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install dependencies
        working-directory: windows
        run: npm ci

      - name: Type-check and verify protocol vectors
        working-directory: windows
        run: |
          npm run build
          node scripts/verify-vectors.mjs

      # Ahead of the bundle step on purpose. The Rust backend uses Windows-only
      # APIs (DXGI Desktop Duplication, Task 8.1) that cannot be compiled on a
      # contributor's Mac, so this is the first place a type error can surface —
      # and a plain check reports it in a couple of minutes with a readable
      # error, rather than after a full installer build.
      - name: Compile the Rust backend
        working-directory: windows/src-tauri
        run: cargo check --all-targets --locked

      # Task 8.1 acceptance: the encoder must produce a stream that decodes and
      # carries no B-frames, because WebCodecs in low-latency mode cannot
      # reorder. Checked here rather than by hand: this is code that cannot even
      # be compiled on the Mac the project is developed on.
      - name: Encoder self-test (decodes, no B-frames)
        shell: bash
        working-directory: windows/src-tauri
        run: |
          # Not on the runner image by default, and the check is worthless
          # without it — so install rather than skip.
          command -v ffprobe >/dev/null || choco install ffmpeg -y --no-progress
          cargo run --release --example encode_selftest -- selftest.h264
          ffprobe -v error -show_entries stream=codec_name,has_b_frames,width,height \
            -of default=noprint_wrappers=1 selftest.h264 | tee probe.txt
          grep -q '^codec_name=h264$' probe.txt || { echo "::error::not H.264"; exit 1; }
          grep -q '^has_b_frames=0$' probe.txt || { echo "::error::stream has B-frames"; exit 1; }
          # A stream can report the right metadata and still decode to nothing.
          ffmpeg -v error -i selftest.h264 -f null - && echo "decoded cleanly"

      # Task 8.1 acceptance proper: a scripted WebSocket client connects and
      # receives a stream that decodes. The encoder self-test above cannot catch
      # a framing mistake — a length field that counts itself, or a session that
      # opens on a delta frame — because none of that is visible until something
      # actually reads the wire.
      - name: Wire acceptance (scripted WebSocket client)
        shell: bash
        working-directory: windows
        run: |
          cargo build --release --example serve_selftest --manifest-path src-tauri/Cargo.toml
          ./src-tauri/target/release/examples/serve_selftest.exe 7879 synthetic > server.log 2>&1 &
          SERVER=$!
          # Wait for the bind rather than sleeping a guessed interval.
          for _ in $(seq 1 30); do grep -q listening server.log && break; sleep 1; done
          grep -q listening server.log || { echo "::error::sender never bound"; cat server.log; exit 1; }

          node scripts/ws-acceptance.mjs ws://127.0.0.1:7879 wire.h264 40
          kill "$SERVER" 2>/dev/null || true

          ffprobe -v error -show_entries stream=codec_name,has_b_frames \
            -of default=noprint_wrappers=1 wire.h264 | tee wire-probe.txt
          grep -q '^codec_name=h264$' wire-probe.txt || { echo "::error::wire stream is not H.264"; exit 1; }
          grep -q '^has_b_frames=0$' wire-probe.txt || { echo "::error::wire stream has B-frames"; exit 1; }
          ffmpeg -v error -i wire.h264 -f null - && echo "wire stream decoded cleanly"

      # tauri-action reads the signing certificate from these env vars. Left
      # unset, it produces an UNSIGNED installer — which SmartScreen will warn
      # about until the certificate's reputation is established (see
      # docs/signing.md for the OV vs EV decision).
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: windows
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
