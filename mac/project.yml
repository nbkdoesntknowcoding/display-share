name: DisplayShare
options:
  bundleIdPrefix: in.theboringpeople.displayshare
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    CLANG_ENABLE_MODULES: 'YES'
    MARKETING_VERSION: 0.10.0
    CURRENT_PROJECT_VERSION: '1'
    ARCHS: arm64 x86_64
    ONLY_ACTIVE_ARCH: 'NO'
    DEAD_CODE_STRIPPING: 'YES'
targets:
  vd_helper:
    type: tool
    platform: macOS
    sources:
      - path: vd_helper
      - path: Shared
      - path: CGVirtualDisplayPrivate
    settings:
      base:
        PRODUCT_NAME: vd_helper
        SWIFT_OBJC_INTERFACE_HEADER_NAME: vd_helper-Swift.h
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/CGVirtualDisplayPrivate/include
    dependencies:
      - sdk: CoreGraphics.framework
  DisplayShareCore:
    type: framework
    platform: macOS
    sources:
      - path: DisplayShareCore
      - path: Shared
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.theboringpeople.displayshare.core
        DYLIB_INSTALL_NAME_BASE: '@rpath'
        SKIP_INSTALL: 'YES'
        GENERATE_INFOPLIST_FILE: 'YES'
  DisplayShare:
    type: application
    platform: macOS
    sources:
      - path: DisplayShare
    dependencies:
      - target: DisplayShareCore
        embed: true
      - target: vd_helper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.theboringpeople.displayshare
        INFOPLIST_FILE: DisplayShare/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        ENABLE_HARDENED_RUNTIME: 'YES'
        CODE_SIGN_ENTITLEMENTS: DisplayShare/DisplayShare.entitlements
        CODE_SIGN_STYLE: Manual
      debug:
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGNING_REQUIRED: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
      release:
        CODE_SIGN_IDENTITY: $(DS_CODE_SIGN_IDENTITY)
        CODE_SIGNING_REQUIRED: $(DS_CODE_SIGNING_REQUIRED)
        CODE_SIGNING_ALLOWED: $(DS_CODE_SIGNING_ALLOWED)
  dsprobe:
    type: tool
    platform: macOS
    sources:
      - path: dsprobe
    dependencies:
      - target: DisplayShareCore
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path
  DisplayShareCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DisplayShareCoreTests
    dependencies:
      - target: DisplayShareCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        PRODUCT_BUNDLE_IDENTIFIER: in.theboringpeople.displayshare.core.tests
schemes:
  DisplayShareCore:
    build:
      targets:
        DisplayShareCore: all
        DisplayShareCoreTests:
          - test
    test:
      targets:
        - DisplayShareCoreTests
